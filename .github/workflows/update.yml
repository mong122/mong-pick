name: 채용 목록 갱신 (블로그 RSS → jobs.json)
on:
  schedule:
    - cron: "17 * * * *"   # 한 시간마다 (17분) — 깃허브 예약은 가끔 늦거나 빠질 수 있음
  workflow_dispatch:        # Actions 화면에서 [Run workflow] 로 바로 돌리기
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update.py
      - name: 바뀌었으면 저장
        run: |
          if ! git diff --quiet; then
            git config user.name "mong-pick-bot"
            git config user.email "mong-pick-bot@users.noreply.github.com"
            git commit -am "채용 목록 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            git push
          fi
