<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🎯 오늘 놓치면 아까운 공고 · MONG 생활노트</title>
<meta name="description" content="누를 때마다 마감 전 채용 공고 하나를 골라 드려요. 공고문으로 확인해 정리한 MONG 생활노트 채용 글.">
<meta property="og:type" content="website">
<meta property="og:title" content="🎯 오늘 놓치면 아까운 공고">
<meta property="og:description" content="누를 때마다 마감 전 채용 공고 하나를 골라 드려요 · MONG 생활노트">
<meta property="og:image" content="https://mong122.github.io/mong-pick/og.png">
<meta property="og:url" content="https://mong122.github.io/mong-pick/">
<meta name="referrer" content="no-referrer">
<style>
  :root { --bg:#0e1420; --card:#151d2b; --line:#26324a; --ink:#e9eef6; --sub:#9aa7ba; --acc:#2ecc71; --hot:#ff6b5e; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif; }
  .wrap { max-width:520px; margin:0 auto; padding:20px 16px 40px; }
  .top { color:var(--sub); font-size:13px; letter-spacing:.02em; }
  .safe { background:#12261b; border:1px solid #1f4d33; color:#bfeccf; border-radius:12px; padding:10px 12px; font-size:14px; line-height:1.5; margin:4px 0 14px; }
  h1 { font-size:22px; margin:6px 0 16px; }
  .pick { background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden; display:block; color:inherit; text-decoration:none; }
  .pick img { width:100%; aspect-ratio:1/1; object-fit:cover; display:block; background:#0b1018; }
  .pick .body { padding:14px 16px 16px; }
  .pick .t { font-size:17px; font-weight:700; line-height:1.45; word-break:keep-all; }
  .when { margin-top:8px; font-size:14px; color:var(--sub); }
  .d { display:inline-block; font-weight:800; color:var(--acc); margin-right:6px; }
  .d.hot { color:var(--hot); }
  .go { margin-top:14px; display:flex; gap:8px; }
  .btn { flex:1; text-align:center; padding:12px; border-radius:10px; border:1px solid var(--line); background:#1c2638; color:var(--ink); font-size:15px; font-weight:700; cursor:pointer; text-decoration:none; }
  .btn.main { background:var(--acc); border-color:var(--acc); color:#0b1a10; }
  .count { margin-top:10px; font-size:13px; color:var(--sub); text-align:center; min-height:1.2em; }
  h2 { font-size:15px; color:var(--sub); margin:26px 0 10px; font-weight:600; }
  .more a { display:flex; gap:12px; align-items:center; padding:10px; border:1px solid var(--line); border-radius:12px; margin-bottom:8px; color:inherit; text-decoration:none; background:var(--card); }
  .more img { width:56px; height:56px; border-radius:8px; object-fit:cover; flex:none; background:#0b1018; }
  .more .t { font-size:14px; line-height:1.4; word-break:keep-all; }
  .all { display:block; margin-top:18px; text-align:center; color:var(--sub); font-size:14px; }
  .sign { margin-top:26px; text-align:center; color:#5d6a80; font-size:12px; }
  .empty { padding:30px 10px; text-align:center; color:var(--sub); }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">MONG 생활노트 · 채용정보</div>
  <h1>🎯 오늘 놓치면 아까운 공고</h1>
  <div class="safe">✅ MONG 생활노트 블로그의 <b>공고 고르기 화면</b>이에요. 마감 전 채용 글 하나를 골라 <b>네이버 블로그 글로 데려다 드려요.</b> 광고·가입·결제는 없어요.</div>
  <div id="main"><div class="empty">공고를 고르는 중…</div></div>
  <div id="more"></div>
  <a class="all" id="all" href="https://blog.naver.com/PostList.naver?blogId=eleode123&from=postList&categoryNo=29">📋 채용정보 전체 목록 보기 →</a>
  <div class="sign">- MONG 생활노트 -</div>
</div>
<script>
(() => {
  // 목록 = jobs.json (깃허브가 한 시간마다 블로그 RSS 로 다시 만듦, scripts/update.py)
  // 고르는 법: 마감 안 지난 글 중 무작위, 마감이 가까울수록 더 자주 · 3초 뒤 그 글로 (화면을 만지면 멈춤)
  const WAIT = 3;
  const WEEK = '일월화수목금토';
  const $ = (id) => document.getElementById(id);
  const endOf = (j) => new Date(j.end + ':00+09:00');
  const big = (u) => (u || '').replace(/\?type=\w+$/, '') + '?type=w2';
  const esc = (s) => String(s || '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const dLabel = (j) => {
    const e = endOf(j);
    const kst = new Date(e.getTime() + 9 * 36e5);
    const today = new Date(Date.now() + 9 * 36e5);
    const d = Math.round((Date.UTC(kst.getUTCFullYear(), kst.getUTCMonth(), kst.getUTCDate()) - Date.UTC(today.getUTCFullYear(), today.getUTCMonth(), today.getUTCDate())) / 864e5);
    const hm = j.end.slice(11, 16);
    const when = `${kst.getUTCMonth() + 1}월 ${kst.getUTCDate()}일(${WEEK[kst.getUTCDay()]})${hm && hm !== '23:59' ? ' ' + hm : ''} 마감`;
    return { d, text: d <= 0 ? '오늘 마감' : `D-${d}`, when };
  };
  const weightOf = (j) => 1 / (Math.max(0, (endOf(j) - Date.now()) / 864e5) + 1);
  let timer = null;
  let open = [];
  let cur = null;

  function pick(except) {
    const pool = open.filter((j) => j !== except);
    const list = pool.length ? pool : open;
    let r = Math.random() * list.reduce((s, j) => s + weightOf(j), 0);
    for (const j of list) if ((r -= weightOf(j)) <= 0) return j;
    return list[list.length - 1];
  }

  function stop() {
    clearInterval(timer);
    timer = null;
    $('count').textContent = '';
  }

  function show(j) {
    cur = j;
    const L = dLabel(j);
    $('main').innerHTML = `
      <a class="pick" href="${esc(j.url)}" id="go1">
        <img src="${esc(big(j.thumb))}" alt="" referrerpolicy="no-referrer">
        <div class="body">
          <div class="t">${esc(j.title)}</div>
          <div class="when"><span class="d${L.d <= 3 ? ' hot' : ''}">${L.text}</span>${esc(L.when)}</div>
        </div>
      </a>
      <div class="go"><a class="btn main" href="${esc(j.url)}">이 공고 보러 가기</a><button class="btn" id="again" type="button">🎲 다른 공고</button></div>
      <div class="count" id="count"></div>`;
    $('again').onclick = () => (stop(), show(pick(cur)));
    const others = open.filter((x) => x !== j).sort((a, b) => endOf(a) - endOf(b)).slice(0, 3);
    $('more').innerHTML = others.length
      ? `<h2>마감 가까운 다른 공고</h2><div class="more">${others.map((x) => { const l = dLabel(x); return `<a href="${esc(x.url)}"><img src="${esc(x.thumb)}" alt="" referrerpolicy="no-referrer"><div class="t"><span class="d${l.d <= 3 ? ' hot' : ''}">${l.text}</span>${esc(x.title)}</div></a>`; }).join('')}</div>`
      : '';
    let left = WAIT;
    clearInterval(timer);
    $('count').textContent = `${left}초 뒤 이 공고로 이동해요 · 화면을 누르면 멈춰요`;
    timer = setInterval(() => {
      left -= 1;
      if (left <= 0) return stop(), location.replace(j.url);
      $('count').textContent = `${left}초 뒤 이 공고로 이동해요 · 화면을 누르면 멈춰요`;
    }, 1000);
  }

  // 화면을 만지거나 내리면 자동 이동을 멈춤 (다른 공고를 고르는 사람)
  ['touchstart', 'wheel', 'keydown'].forEach((ev) => addEventListener(ev, () => timer && stop(), { passive: true }));
  addEventListener('mousedown', (e) => { if (timer && !e.target.closest('a')) stop(); });

  fetch('jobs.json?t=' + Date.now(), { cache: 'no-store' })
    .then((r) => r.json())
    .then((data) => {
      if (data.category) $('all').href = data.category;
      open = (data.jobs || []).filter((j) => endOf(j) > Date.now());
      if (!open.length) {
        $('main').innerHTML = '<div class="empty">지금 마감 전인 공고가 없어요.<br>채용정보 전체 목록으로 이동할게요.</div>';
        return setTimeout(() => location.replace($('all').href), 2000);
      }
      show(pick());
    })
    .catch(() => {
      $('main').innerHTML = '<div class="empty">목록을 못 불러왔어요. 아래 전체 목록에서 봐 주세요.</div>';
    });
})();
</script>
</body>
</html>
